<html>
    <head>
        <script src="./lib.js"></script>
        <link href="./lib.css" rel="stylesheet" />
    </head>

<body onload="renderScripts()">
<div id="scriptsToShow">
<script>
class Foo {
    bar() {
        log("barbar");
    }
}
log("foo");
log([1,2,3]);
log({
    name: "john", 
    dog: {
        name: "Rolf",
        age: 42,
        state: undefined, 
        winter: null,
    }
});
</script>
<script>
const foobar = {
    foo: "bar",
    baz: 42
};

for(let propName of Object.getOwnPropertyNames(foobar)){
    let val = foobar[propName];
    log(`${propName}: ${val}`);
}

log(foobar);

</script>
</div>
</body>
</html>
