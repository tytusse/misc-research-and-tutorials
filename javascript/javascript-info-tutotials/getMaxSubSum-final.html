<script src="test.js"></script>
<script>
  // (n^2 + n) / 2
  function getMaxSubSum(arr) {
    if(arr.length == 0) { 
      return 0; 
    }

    let result = arr[0];
    for(let s=0; s < arr.length;s++) {
      let sum = 0;
      for(let i=s; i < arr.length; i++) {
          sum+=arr[i];
          result = Math.max(result, sum);
      }

      if(result<0) {
        return 0;
      }
    }

    return result;
  }

  // Kadane's algorithm
  function getMaxSubSum2(arr) {    
    let result = 0;
    let localMax = 0;
    for(let i=0; i < arr.length; i++) {
        localMax = Math.max(localMax+arr[i], arr[i]);
        result = Math.max(localMax, result);
    }

    return result;
  }

  // Karol's algorithm
  function getMaxSubSumKar(arr) {
    let current = 0;
    let best = 0;
    for(let v of arr){
      current += v;
      if(current < 0){
        current = 0;
      } else if(current > best){
        best = current;
      }
    }

    return best;
  }

</script>
</html>
